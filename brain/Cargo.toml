[package]
edition = "2024"
name = "hydro_brain"
rust-version = "1.88"
version = "0.1.0"


[[bin]]
name = "hydro_brain"
path = "./src/bin/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
log = "0.4.27"

critical-section = "1.2.0"
embedded-io = "0.7.1"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
  "esp-now",
] }


pca9685 = { path = "../pca9685", version = "0.1.0" }
ina226 = { path = "../ina226", version = "0.1.0" }
icm42688 = { path = "../icm42688", version = "0.1.0" }
bytemuck = { version = "1.25.0", default-features = false, features = [
  "derive",
] }
nb = "1.1"
libm = "0.2.16"
util_types = { version = "0.1.0", path = "../util_types/" }
esp-nvs = { version = "0.4.0", features=["esp32c3"]}
esp-storage = { version = "0.9.0", features = ["esp32c3"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
